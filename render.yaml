# Render blueprint for the HireFlow AI backend and database.
# The frontend deploys separately to Vercel with BACKEND_API_URL pointing here.
#
# Secrets (sync: false) are set in the Render dashboard, never committed.

databases:
  - name: hireflow-db
    databaseName: hireflow
    plan: free

services:
  - type: web
    name: hireflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

      # Public URL of this service; Hunar webhook callbacks are built from it.
      - key: PUBLIC_BACKEND_URL
        sync: false
      # Origin of the deployed frontend.
      - key: CORS_ORIGINS
        sync: false

      # Leave DEMO_MODE=true until real calling is intended.
      - key: DEMO_MODE
        value: "true"

      - key: HUNAR_API_KEY
        sync: false
      - key: HUNAR_WEBHOOK_SECRET
        sync: false

      - key: PEOPLE_SEARCH_PROVIDER
        value: mock
      - key: PDL_API_KEY
        sync: false

      - key: LLM_PROVIDER
        value: heuristic
      - key: ANTHROPIC_API_KEY
        sync: false

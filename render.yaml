# Render blueprint for the HireFlow AI backend and its database.
#
# The frontend deploys separately to Vercel, with BACKEND_API_URL pointing at
# this service. Because the browser only ever calls the Next.js proxy, the two
# never need to agree on CORS for the normal path.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
#
# Secrets are marked `sync: false`, so Render prompts for them in the dashboard
# and they are never committed here.

# IMPORTANT: the database and the web service must share a region. Render's
# `fromDatabase` supplies the *internal* connection string, which only resolves
# inside its own region - a mismatch makes the service hang on start-up trying
# to reach a database it cannot route to.
databases:
  - name: hireflow-db
    databaseName: hireflow
    user: hireflow
    plan: free
    region: oregon

services:
  - type: web
    name: hireflow-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Render injects the connection string from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      # PUBLIC_BACKEND_URL is resolved automatically from Render's own
      # RENDER_EXTERNAL_URL (see app/core/config.py), so Hunar webhook
      # callbacks are correct on the very first deploy.

      # Set this to the deployed Vercel origin if you ever call the API
      # directly from the browser instead of through the Next.js proxy.
      - key: CORS_ORIGINS
        sync: false

      # Conversations are simulated until this is false AND a working Hunar key
      # is present. An expired key falls back to simulation automatically.
      - key: DEMO_MODE
        value: "true"
      - key: HUNAR_API_KEY
        sync: false
      - key: HUNAR_WEBHOOK_SECRET
        sync: false

      - key: PEOPLE_SEARCH_PROVIDER
        value: mock
      - key: PDL_API_KEY
        sync: false

      - key: LLM_PROVIDER
        value: heuristic
      - key: ANTHROPIC_API_KEY
        sync: false

[project]
name = "hireflow-backend"
version = "1.0.0"
description = "HireFlow AI - FastAPI backend for AI voice interviewing, sourcing and outreach."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query() defaults are the framework's own idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long lines in these two files are data (job descriptions, candidate records),
# not code, and wrapping them would hurt readability.
"scripts/seed.py" = ["E501"]
"app/integrations/people_search/mock_dataset.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
